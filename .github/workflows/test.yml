name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Logic and GTK checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-gi gir1.2-gtk-3.0 xvfb xauth

      - name: Logic checks
        run: python3 tests/settings_test.py

      - name: GTK checks
        run: GDK_BACKEND=x11 xvfb-run -a python3 tests/settings_test.py --gtk
